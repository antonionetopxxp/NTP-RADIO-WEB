<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Eventos da NTP RÁDIO WEB"
  >

  <title>Eventos — NTP RÁDIO WEB</title>

  <link
    rel="stylesheet"
    href="../style.css"
  >

  <style>

    .page-container {
      width: min(1180px, 92%);
      margin: 0 auto;
      padding: 40px 0 80px;
    }

    .page-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 30px;
    }

    .page-actions a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 16px;
      border: 1px solid rgba(166,107,255,.35);
      border-radius: 12px;
      color: #fff;
      text-decoration: none;
      background: rgba(20,12,42,.75);
      transition: .2s ease;
    }

    .page-actions a:hover {
      border-color: #a66bff;
      transform: translateY(-2px);
    }

    .page-title {
      margin-bottom: 30px;
    }

    .page-title h1 {
      margin: 0 0 8px;
      color: #fff;
      font-size: clamp(2rem, 5vw, 3rem);
    }

    .page-title p {
      margin: 0;
      color: #a79bc4;
    }

    .events-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .event-card-public {
      overflow: hidden;
      border: 1px solid rgba(123,44,255,.28);
      border-radius: 20px;
      background:
        linear-gradient(
          145deg,
          rgba(18,10,38,.96),
          rgba(5,5,15,.96)
        );
      box-shadow:
        0 15px 45px rgba(0,0,0,.25);
    }

    .event-image {
      width: 100%;
      height: 210px;
      object-fit: cover;
      display: block;
      background: #090711;
    }

    .event-content {
      padding: 20px;
    }

    .event-date {
      display: inline-block;
      margin-bottom: 10px;
      color: #a66bff;
      font-size: .9rem;
      font-weight: 700;
    }

    .event-content h2 {
      margin: 0 0 12px;
      color: #fff;
      font-size: 1.3rem;
    }

    .event-info {
      display: grid;
      gap: 7px;
      margin-bottom: 15px;
      color: #c4b9dd;
      font-size: .94rem;
    }

    .event-description {
      color: #a79bc4;
      line-height: 1.6;
    }

    .empty-events {
      padding: 45px 20px;
      text-align: center;
      border: 1px dashed rgba(166,107,255,.3);
      border-radius: 18px;
      color: #a79bc4;
      background: rgba(10,7,24,.65);
    }

    @media (max-width: 600px) {

      .page-container {
        padding-top: 25px;
      }

      .page-actions {
        flex-direction: column;
      }

      .page-actions a {
        width: 100%;
      }

      .event-image {
        height: 190px;
      }

    }

  </style>
</head>

<body>

  <main class="page-container">

    <nav class="page-actions">

      <a href="../index.html">
        ← Voltar para a Rádio
      </a>

      <a href="../admin/index.html">
        ⚙ Painel Admin
      </a>

    </nav>


    <header class="page-title">

      <h1>📅 Eventos</h1>

      <p>
        Confira os próximos eventos da
        NTP RÁDIO WEB.
      </p>

    </header>


    <section
      class="events-grid"
      id="publicEventsList"
    ></section>

  </main>


  <script>

    const EVENTS_KEY =
      "ntp_radio_eventos";


    function escapeHTML(value = "") {

      return String(value).replace(
        /[&<>"']/g,
        character => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        })[character]
      );

    }


    function formatDate(value) {

      if (!value) return "";

      const date =
        new Date(
          value + "T00:00:00"
        );

      if (Number.isNaN(date.getTime())) {
        return value;
      }

      return date.toLocaleDateString(
        "pt-BR"
      );

    }


    function loadEvents() {

      try {

        const data =
          JSON.parse(
            localStorage.getItem(
              EVENTS_KEY
            ) || "[]"
          );

        return Array.isArray(data)
          ? data
          : [];

      } catch {

        return [];

      }

    }


    function renderEvents() {

      const container =
        document.getElementById(
          "publicEventsList"
        );

      if (!container) return;


      const events =
        loadEvents()
          .filter(
            event =>
              event &&
              event.published === true
          )
          .sort(
            (a, b) =>
              String(a.date || "")
                .localeCompare(
                  String(b.date || "")
                )
          );


      if (!events.length) {

        container.innerHTML = `

          <div class="empty-events">

            <strong>
              Nenhum evento disponível.
            </strong>

            <p>
              Novos eventos serão publicados
              em breve.
            </p>

          </div>

        `;

        return;

      }


      container.innerHTML =
        events.map(event => `

          <article
            class="event-card-public"
          >

            ${
              event.image
                ? `
                  <img
                    class="event-image"
                    src="${escapeHTML(event.image)}"
                    alt="${escapeHTML(event.title || "Evento")}"
                    loading="lazy"
                  >
                `
                : ""
            }

            <div class="event-content">

              ${
                event.date
                  ? `
                    <span class="event-date">
                      📅 ${escapeHTML(
                        formatDate(event.date)
                      )}
                    </span>
                  `
                  : ""
              }

              <h2>
                ${escapeHTML(
                  event.title || ""
                )}
              </h2>

              <div class="event-info">

                ${
                  event.time
                    ? `
                      <span>
                        🕐 ${escapeHTML(event.time)}
                      </span>
                    `
                    : ""
                }

                ${
                  event.location
                    ? `
                      <span>
                        📍 ${escapeHTML(
                          event.location
                        )}
                      </span>
                    `
                    : ""
                }

              </div>

              ${
                event.description
                  ? `
                    <div class="event-description">
                      ${escapeHTML(
                        event.description
                      )}
                    </div>
                  `
                  : ""
              }

            </div>

          </article>

        `).join("");

    }


    renderEvents();


    window.addEventListener(
      "storage",
      event => {

        if (
          event.key === EVENTS_KEY
        ) {

          renderEvents();

        }

      }
    );


    window.addEventListener(
      "pageshow",
      renderEvents
    );

  </script>

</body>
</html>
