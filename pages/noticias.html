<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Notícias — NTP RÁDIO WEB</title>

  <meta
    name="description"
    content="Confira as últimas notícias da NTP RÁDIO WEB."
  >

  <link rel="stylesheet" href="../style.css">

  <style>
    .news-page {
      min-height: 100vh;
      padding: 120px 20px 80px;
      background:
        radial-gradient(circle at 15% 10%, rgba(109,40,255,.16), transparent 30%),
        radial-gradient(circle at 85% 30%, rgba(166,107,255,.10), transparent 28%),
        #02030a;
    }

    .news-container {
      width: min(1150px, 100%);
      margin: 0 auto;
    }

    .news-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 45px;
      flex-wrap: wrap;
    }

    .news-heading span {
      display: block;
      margin-bottom: 8px;
      color: #a66bff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .news-heading h1 {
      margin: 0;
      color: #fff;
      font-size: clamp(32px, 5vw, 56px);
    }

    .news-heading p {
      max-width: 650px;
      margin-top: 12px;
      color: #aaa3bd;
      line-height: 1.7;
    }

    .news-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .news-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 18px;
      border: 1px solid #39236d;
      border-radius: 10px;
      color: #fff;
      background: #0c0718;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      transition: .2s ease;
    }

    .news-button:hover {
      border-color: #8b5cf6;
      transform: translateY(-2px);
    }

    .news-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
    }

    .news-card {
      overflow: hidden;
      border: 1px solid #2a1d55;
      border-radius: 18px;
      background: linear-gradient(180deg, #10091f, #07050f);
      box-shadow: 0 18px 50px rgba(0,0,0,.25);
      transition: transform .2s ease, border-color .2s ease;
    }

    .news-card:hover {
      transform: translateY(-5px);
      border-color: #6d28ff;
    }

    .news-image {
      width: 100%;
      height: 210px;
      object-fit: cover;
      display: block;
      background: #0a0712;
    }

    .news-content {
      padding: 22px;
    }

    .news-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
      color: #a66bff;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .news-content h2 {
      margin: 0 0 12px;
      color: #fff;
      font-size: 21px;
      line-height: 1.3;
    }

    .news-content p {
      margin: 0;
      color: #aaa3bd;
      line-height: 1.65;
      font-size: 14px;
    }

    .news-empty {
      grid-column: 1 / -1;
      padding: 60px 25px;
      border: 1px dashed #39236d;
      border-radius: 18px;
      text-align: center;
      color: #aaa3bd;
      background: rgba(10,7,18,.7);
    }

    .news-empty strong {
      display: block;
      margin-bottom: 8px;
      color: #fff;
      font-size: 20px;
    }

    @media (max-width: 900px) {
      .news-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 600px) {
      .news-page {
        padding: 100px 14px 50px;
      }

      .news-grid {
        grid-template-columns: 1fr;
      }

      .news-top {
        margin-bottom: 30px;
      }

      .news-actions {
        width: 100%;
      }

      .news-button {
        flex: 1;
      }

      .news-image {
        height: 200px;
      }
    }
  </style>
</head>

<body>

  <main class="news-page">

    <div class="news-container">

      <div class="news-top">

        <div class="news-heading">

          <span>NTР RÁDIO WEB</span>

          <h1>Notícias</h1>

          <p>
            Informação, novidades e tudo o que acontece
            na nossa rádio e na nossa programação.
          </p>

        </div>

        <div class="news-actions">

          <a
            href="../index.html"
            class="news-button">
            ← Voltar para a Rádio
          </a>

          <a
            href="../admin/index.html"
            class="news-button">
            ⚙ Painel Admin
          </a>

        </div>

      </div>


      <section
        class="news-grid"
        id="publicNewsList">

        <div class="news-empty">

          <strong>Carregando notícias...</strong>

          Aguarde enquanto carregamos as publicações da rádio.

        </div>

      </section>

    </div>

  </main>


  <script>

    const NEWS_KEY = "ntp_radio_noticias";

    const list = document.getElementById("publicNewsList");


    function escapeHTML(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function formatDate(value) {

      if (!value) return "";

      const date = new Date(value + "T00:00:00");

      if (Number.isNaN(date.getTime())) {
        return value;
      }

      return date.toLocaleDateString("pt-BR");

    }


    function loadNews() {

      let news = [];

      try {

        news = JSON.parse(
          localStorage.getItem(NEWS_KEY) || "[]"
        );

      } catch (error) {

        news = [];

      }


      news = Array.isArray(news)
        ? news.filter(item => item && item.published === true)
        : [];


      news.sort((a, b) => {

        const dateA = new Date(a.date || 0).getTime();
        const dateB = new Date(b.date || 0).getTime();

        return dateB - dateA;

      });


      renderNews(news);

    }


    function renderNews(news) {

      if (!news.length) {

        list.innerHTML = `
          <div class="news-empty">
            <strong>Nenhuma notícia publicada</strong>
            As próximas notícias da NTP RÁDIO WEB aparecerão aqui.
          </div>
        `;

        return;

      }


      list.innerHTML = news.map(item => {

        const image = item.image
          ? escapeHTML(item.image)
          : "../ntp1.png";


        return `

          <article class="news-card">

            <img
              class="news-image"
              src="${image}"
              alt="${escapeHTML(item.title || "Notícia")}"
              loading="lazy"
              onerror="this.src='../ntp1.png'"
            >

            <div class="news-content">

              <div class="news-meta">

                <span>
                  ${escapeHTML(item.category || "Notícia")}
                </span>

                ${item.date
                  ? `<span>•</span><span>${formatDate(item.date)}</span>`
                  : ""
                }

              </div>


              <h2>
                ${escapeHTML(item.title || "Sem título")}
              </h2>


              <p>
                ${escapeHTML(item.summary || "")}
              </p>

            </div>

          </article>

        `;

      }).join("");

    }


    loadNews();


    window.addEventListener("storage", event => {

      if (event.key === NEWS_KEY) {
        loadNews();
      }

    });


    window.addEventListener("pageshow", loadNews);

  </script>

</body>
</html>
