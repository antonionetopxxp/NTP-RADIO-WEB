<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>NTP RADIO OS — Auto DJ</title>

  <link
    rel="stylesheet"
    href="auto-dj.css"
  >

</head>

<body>

  <header>

    <h1>
      🎧 NTP RADIO OS — Auto DJ
    </h1>

    <p>
      Central de automação da programação da rádio
    </p>

  </header>


  <main>

    <div class="status">

      Status:

      <strong id="systemStatus">
        Inicializando...
      </strong>

    </div>


    <div class="grid">


      <div class="card">

        <h2>
          📻 Programa atual
        </h2>

        <div
          id="programName"
          class="value"
        >
          —
        </div>

        <div
          id="programPresenter"
          class="muted"
        >
          —
        </div>

        <div
          id="programTime"
          class="muted"
        >
          —
        </div>

      </div>


      <div class="card">

        <h2>
          🎵 Playlist
        </h2>

        <div
          id="playlistName"
          class="value"
        >
          —
        </div>

        <div
          id="playlistMode"
          class="muted"
        >
          —
        </div>

      </div>


      <div class="card">

        <h2>
          🎶 Música selecionada
        </h2>

        <div
          id="musicTitle"
          class="value"
        >
          —
        </div>

        <div
          id="musicArtist"
          class="muted"
        >
          —
        </div>

      </div>


    </div>


    <button
      id="refreshBtn"
      class="button"
      type="button"
    >
      🔄 Atualizar Auto DJ
    </button>


  </main>


  <!-- MOTOR AUTO-DJ -->
  <script src="auto-dj.js"></script>

  <!-- INTERFACE AUTO-DJ -->
  <script src="auto-dj-ui.js"></script>


</body>

</html>
