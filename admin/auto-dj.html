<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>NTP RADIO OS — Auto DJ</title>

  <link
    rel="stylesheet"
    href="auto-dj.css"
  >

</head>

<body>

  <header>

    <h1>
      🎧 NTP RADIO OS — Auto DJ
    </h1>

    <p>
      Central de automação da programação da rádio
    </p>

  </header>


  <main>

    <!-- STATUS DO SISTEMA -->

    <div class="status">

      Status:

      <strong id="systemStatus">
        Inicializando...
      </strong>

    </div>


    <!-- PAINEL PRINCIPAL -->

    <div class="grid">


      <!-- PROGRAMA -->

      <div class="card">

        <h2>
          📻 Programa atual
        </h2>

        <div
          id="programName"
          class="value"
        >
          —
        </div>

        <div
          id="programPresenter"
          class="muted"
        >
          —
        </div>

        <div
          id="programTime"
          class="muted"
        >
          —
        </div>

      </div>


      <!-- PLAYLIST -->

      <div class="card">

        <h2>
          🎵 Playlist
        </h2>

        <div
          id="playlistName"
          class="value"
        >
          —
        </div>

        <div
          id="playlistMode"
          class="muted"
        >
          —
        </div>

      </div>


      <!-- MÚSICA -->

      <div class="card">

        <h2>
          🎶 Música selecionada
        </h2>

        <div
          id="musicTitle"
          class="value"
        >
          —
        </div>

        <div
          id="musicArtist"
          class="muted"
        >
          —
        </div>

      </div>


    </div>


    <!-- CONTROLES -->

    <div class="controls">

      <button
        id="refreshBtn"
        class="button"
        type="button"
      >
        🔄 Atualizar Auto DJ
      </button>

    </div>


  </main>


  <!-- =====================================================
       MOTOR AUTO DJ
       ===================================================== -->

  <script src="auto-dj.js"></script>


  <!-- =====================================================
       INTERFACE AUTO DJ
       ===================================================== -->

 <script src="auto-dj-ui.js"></script>


  <!-- =====================================================
       CONEXÃO EXTRA DA INTERFACE
       ===================================================== -->

  <script>

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        console.log(
          "[AUTO-DJ HTML] Interface carregada."
        );

        const refreshBtn =
          document.querySelector("#refreshBtn");

        const systemStatus =
          document.querySelector("#systemStatus");


        /*
         * Atualiza o status visual
         */

        function atualizarStatus() {

          if (!systemStatus) {
            return;
          }

          if (
            window.NTP_AUTO_DJ &&
            typeof window.NTP_AUTO_DJ.executar === "function"
          ) {

            systemStatus.textContent =
              "AUTO DJ ONLINE";

            systemStatus.classList.add("active");
            systemStatus.classList.remove("inactive");

          } else {

            systemStatus.textContent =
              "AUTO DJ OFFLINE";

            systemStatus.classList.remove("active");
            systemStatus.classList.add("inactive");

          }

        }


        /*
         * Botão atualizar
         */

        if (refreshBtn) {

          refreshBtn.addEventListener(
            "click",
            function () {

              console.log(
                "[AUTO-DJ HTML] Atualização solicitada."
              );

              atualizarStatus();

              if (
                window.NTP_AUTO_DJ &&
                typeof window.NTP_AUTO_DJ.executar === "function"
              ) {

                window.NTP_AUTO_DJ.executar();

              } else {

                console.error(
                  "[AUTO-DJ HTML] Motor Auto DJ não encontrado."
                );

              }

            }
          );

        }


        /*
         * Verificação inicial
         */

        setTimeout(
          atualizarStatus,
          300
        );


        /*
         * Verificação periódica
         */

        setInterval(
          atualizarStatus,
          5000
        );

      }
    );

  </script>


</body>

</html>
