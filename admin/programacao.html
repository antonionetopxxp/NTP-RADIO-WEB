<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#02030a"
  >

  <title>
    Programação | NTP RADIO OS
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


<!-- =====================================================
     CABEÇALHO
===================================================== -->

<header class="admin-header">

  <div class="admin-brand">

    <strong>NTP</strong>

    <span>RADIO OS</span>

  </div>


  <div class="admin-actions">

    <a
      class="admin-button"
      href="../index.html"
    >
      📻 Ver rádio
    </a>


    <a
      class="admin-button logout"
      href="index.html"
    >
      ← Painel
    </a>

  </div>

</header>



<!-- =====================================================
     MENU
===================================================== -->

<nav class="admin-sidebar">

  <a
    class="sidebar-link"
    href="index.html"
  >
    🏠 Dashboard
  </a>


  <a
    class="sidebar-link active"
    href="programacao.html"
  >
    📅 Programação
  </a>


  <a
    class="sidebar-link"
    href="../pages/noticias.html"
  >
    📰 Notícias
  </a>


  <a
    class="sidebar-link"
    href="../pages/eventos.html"
  >
    🎫 Eventos
  </a>

</nav>



<!-- =====================================================
     CONTEÚDO
===================================================== -->

<main class="programacao-page">


  <div class="page-header">

    <h1>
      📅 Gerenciador de Programação
    </h1>

    <p>
      Cadastre os programas e horários
      da NTP RÁDIO WEB.
    </p>

  </div>



  <!-- ===================================================
       AVISO
  ==================================================== -->

  <div
    id="notice"
    class="notice"
  ></div>



  <!-- ===================================================
       GRID
  ==================================================== -->

  <div class="programacao-grid">


    <!-- ===============================================
         FORMULÁRIO
    ================================================ -->

    <section class="program-form">

      <h2 id="formTitle">
        Novo programa
      </h2>


      <form id="programForm">


        <!-- ID OCULTO -->

        <input
          type="hidden"
          id="programId"
        >



        <!-- NOME -->

        <div class="form-group">

          <label for="programName">
            Nome do programa
          </label>

          <input
            type="text"
            id="programName"
            placeholder="Ex.: Manhã NTP"
            autocomplete="off"
            required
          >

        </div>



        <!-- APRESENTADOR -->

        <div class="form-group">

          <label for="presenter">
            Apresentador
          </label>

          <input
            type="text"
            id="presenter"
            placeholder="Ex.: Neto"
            autocomplete="off"
          >

        </div>



        <!-- DIA -->

        <div class="form-group">

          <label for="day">
            Dia da semana
          </label>

          <select
            id="day"
            required
          >

            <option value="">
              Selecione o dia
            </option>

            <option value="segunda">
              Segunda-feira
            </option>

            <option value="terca">
              Terça-feira
            </option>

            <option value="quarta">
              Quarta-feira
            </option>

            <option value="quinta">
              Quinta-feira
            </option>

            <option value="sexta">
              Sexta-feira
            </option>

            <option value="sabado">
              Sábado
            </option>

            <option value="domingo">
              Domingo
            </option>

          </select>

        </div>



        <!-- HORÁRIOS -->

        <div class="time-grid">


          <div class="form-group">

            <label for="startTime">
              Início
            </label>

            <input
              type="time"
              id="startTime"
              required
            >

          </div>



          <div class="form-group">

            <label for="endTime">
              Término
            </label>

            <input
              type="time"
              id="endTime"
              required
            >

          </div>


        </div>



        <!-- DESCRIÇÃO -->

        <div class="form-group">

          <label for="description">
            Descrição
          </label>

          <textarea
            id="description"
            placeholder="Descreva o programa..."
          ></textarea>

        </div>



        <!-- ATIVO -->

        <div class="checkbox-row">

          <input
            type="checkbox"
            id="active"
            checked
          >

          <label for="active">
            Programa ativo
          </label>

        </div>



        <!-- BOTÕES -->

        <div class="form-buttons">

          <button
            type="submit"
            class="btn btn-primary"
          >
            💾 Salvar programa
          </button>


          <button
            type="button"
            id="cancelEdit"
            class="btn btn-secondary"
            style="display:none"
          >
            Cancelar
          </button>

        </div>


      </form>

    </section>



    <!-- ===============================================
         LISTA
    ================================================ -->

    <section class="program-list">

      <h2>
        Programas cadastrados
      </h2>


      <div id="programList">

        <div class="empty">

          Carregando programação...

        </div>

      </div>

    </section>


  </div>

</main>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script src="programacao.js?v=3"></script>

</body>

      </html>
